<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热梗音乐播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 头部信息 */
        .header {
            text-align: center;
            padding: 30px 0;
        }
        
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .meme-title {
            font-size: 1.2rem;
            color: #feca57;
            margin-bottom: 5px;
        }
        
        .date-info {
            font-size: 0.9rem;
            color: #a0a0a0;
        }
        
        /* 专辑封面 */
        .album-cover {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        
        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* 音频播放器 */
        .audio-player {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        
        .progress-container {
            margin-bottom: 15px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #a0a0a0;
            margin-top: 8px;
        }
        
        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            padding: 10px;
        }
        
        .control-btn:hover {
            transform: scale(1.2);
            color: #feca57;
        }
        
        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 5px 20px rgba(255,107,107,0.4);
        }
        
        .play-btn:hover {
            transform: scale(1.1);
            color: #fff;
        }
        
        /* 速度控制 */
        .speed-control {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        
        .speed-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .speed-btn:hover, .speed-btn.active {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            border-color: transparent;
        }
        
        /* 歌词区域 */
        .lyrics-container {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
            height: 400px;
            overflow-y: auto;
            scroll-behavior: smooth;
            backdrop-filter: blur(10px);
        }
        
        .lyrics-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .lyrics-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        
        .lyrics-container::-webkit-scrollbar-thumb {
            background: #feca57;
            border-radius: 3px;
        }
        
        .lyric-line {
            padding: 12px 20px;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.5);
            text-align: center;
            transition: all 0.3s;
            cursor: default;
        }
        
        .lyric-line.active {
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(90deg, transparent, rgba(254,202,87,0.2), transparent);
            text-shadow: 0 0 20px rgba(254,202,87,0.5);
        }
        
        .lyric-line.before {
            color: rgba(255,255,255,0.3);
        }
        
        /* 底部信息 */
        .footer {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 0.85rem;
        }
        
        .footer a {
            color: #feca57;
            text-decoration: none;
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 50px;
            color: #a0a0a0;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        /* 响应式 */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .album-cover {
                width: 150px;
                height: 150px;
            }
            
            .lyrics-container {
                height: 300px;
                padding: 20px;
            }
            
            .lyric-line {
                font-size: 1rem;
                padding: 10px 15px;
            }
            
            .lyric-line.active {
                font-size: 1.1rem;
            }
        }
        
        /* 历史记录 */
        .history-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
            transition: transform 0.3s;
        }
        
        .history-btn:hover {
            transform: scale(1.05);
        }
        
        .history-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .history-modal.show {
            display: flex;
        }
        
        .history-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .history-item:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .history-item-title {
            color: #feca57;
            font-weight: bold;
        }
        
        .history-item-date {
            color: #666;
            font-size: 0.85rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🎵 热梗音乐播放器</h1>
            <div class="meme-title" id="memeTitle">加载中...</div>
            <div class="date-info" id="dateInfo"></div>
        </div>
        
        <!-- 专辑封面 -->
        <div class="album-cover" id="albumCover">🎵</div>
        
        <!-- 音频播放器 -->
        <div class="audio-player">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-btn" onclick="skipBackward()" title="后退5秒">⏪</button>
                <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="control-btn" onclick="skipForward()" title="前进5秒">⏩</button>
            </div>
            
            <div class="speed-control">
                <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
                <button class="speed-btn" onclick="setSpeed(0.75)">0.75x</button>
                <button class="speed-btn active" onclick="setSpeed(1)">1x</button>
                <button class="speed-btn" onclick="setSpeed(1.25)">1.25x</button>
                <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
                <button class="speed-btn" onclick="setSpeed(2)">2x</button>
            </div>
        </div>
        
        <!-- 歌词区域 -->
        <div class="lyrics-container" id="lyricsContainer">
            <div class="lyric-line">🎤 歌词加载中...</div>
        </div>
        
        <!-- 底部 -->
        <div class="footer">
            <p>由 <a href="https://github.com/where20/bgm-audio" target="_blank">bgm-audio</a> 自动生成</p>
        </div>
    </div>
    
    <!-- 历史记录按钮 -->
    <button class="history-btn" onclick="showHistory()">📜 历史记录</button>
    
    <!-- 历史记录弹窗 -->
    <div class="history-modal" id="historyModal" onclick="closeHistory(event)">
        <div class="history-content" onclick="event.stopPropagation()">
            <h2 style="margin-bottom: 20px;">🎵 历史播放</h2>
            <div id="historyList"></div>
            <button onclick="closeHistory()" style="margin-top: 20px; width: 100%; padding: 12px; background: linear-gradient(135deg, #ff6b6b, #feca57); border: none; border-radius: 10px; color: #fff; cursor: pointer;">关闭</button>
        </div>
    </div>
    
    <!-- 音频元素 -->
    <audio id="audioPlayer"></audio>
    
    <script>
        // 全局变量
        let currentMusic = null;
        let lyrics = [];
        let currentLyricIndex = -1;
        let isPlaying = false;
        
        // 初始化
        async function init() {
            try {
                // 加载音乐信息
                const response = await fetch('music.json');
                const data = await response.json();
                
                // 如果URL有参数，加载指定音乐
                const urlParams = new URLSearchParams(window.location.search);
                const musicId = urlParams.get('id');
                
                if (musicId && data.history && data.history.length > 0) {
                    const music = data.history.find(m => m.id === musicId);
                    if (music) {
                        loadMusic(music);
                    } else {
                        loadMusic(data.latest);
                    }
                } else {
                    loadMusic(data.latest);
                }
                
                // 加载历史记录
                if (data.history) {
                    renderHistory(data.history);
                }
                
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('memeTitle').textContent = '加载失败，请刷新重试';
            }
        }
        
        // 加载音乐
        function loadMusic(music) {
            currentMusic = music;
            
            // 更新标题
            document.getElementById('memeTitle').textContent = '🔥 ' + music.meme;
            document.getElementById('dateInfo').textContent = music.date + ' · ' + music.style;
            
            // 更新封面
            const coverEl = document.getElementById('albumCover');
            if (music.image) {
                coverEl.innerHTML = `<img src="${music.image}" alt="封面">`;
            } else {
                coverEl.textContent = music.meme.charAt(0);
            }
            
            // 设置音频
            const audio = document.getElementById('audioPlayer');
            audio.src = music.audio;
            
            // 解析歌词
            parseLyrics(music.lyrics);
            
            // 自动播放
            audio.play().then(() => {
                isPlaying = true;
                updatePlayButton();
            }).catch(e => {
                console.log('自动播放被阻止:', e);
            });
        }
        
        // 解析歌词（支持 [mm:ss.xx] 格式）
        function parseLyrics(text) {
            lyrics = [];
            const lines = text.split('\n');
            
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                
                // 匹配时间戳格式 [mm:ss.xx] 或 [mm:ss]
                const match = line.match(/\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/);
                
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseInt(match[2]);
                    const ms = match[3] ? parseInt(match[3].padEnd(3, '0')) : 0;
                    const time = minutes * 60 + seconds + ms / 1000;
                    const text = match[4].trim();
                    
                    if (text) {
                        lyrics.push({ time, text });
                    }
                } else if (line) {
                    // 没有时间戳的歌词，默认在上一句结束后0.5秒出现
                    const lastTime = lyrics.length > 0 ? lyrics[lyrics.length - 1].time + 3 : 0;
                    lyrics.push({ time: lastTime, text: line });
                }
            });
            
            // 按时间排序
            lyrics.sort((a, b) => a.time - b.time);
            
            // 渲染歌词
            renderLyrics();
        }
        
        // 渲染歌词到DOM
        function renderLyrics() {
            const container = document.getElementById('lyricsContainer');
            container.innerHTML = '';
            
            lyrics.forEach((lyric, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.textContent = lyric.text;
                div.dataset.index = index;
                container.appendChild(div);
            });
        }
        
        // 更新歌词高亮
        function updateLyrics() {
            const audio = document.getElementById('audioPlayer');
            const currentTime = audio.currentTime;
            const container = document.getElementById('lyricsContainer');
            const lyricLines = container.querySelectorAll('.lyric-line');
            
            // 找到当前应该高亮的歌词
            let newIndex = -1;
            for (let i = lyrics.length - 1; i >= 0; i--) {
                if (currentTime >= lyrics[i].time) {
                    newIndex = i;
                    break;
                }
            }
            
            // 如果歌词变化了
            if (newIndex !== currentLyricIndex) {
                currentLyricIndex = newIndex;
                
                // 更新样式
                lyricLines.forEach((line, index) => {
                    line.classList.remove('active', 'before');
                    if (index === newIndex) {
                        line.classList.add('active');
                    } else if (index < newIndex) {
                        line.classList.add('before');
                    }
                });
                
                // 滚动到当前歌词
                if (newIndex >= 0) {
                    const activeLine = lyricLines[newIndex];
                    if (activeLine) {
                        const containerHeight = container.clientHeight;
                        const lineTop = activeLine.offsetTop;
                        const scrollTo = lineTop - containerHeight / 3;
                        
                        container.scrollTo({
                            top: scrollTo,
                            behavior: 'smooth'
                        });
                    }
                }
            }
        }
        
        // 播放/暂停
        function togglePlay() {
            const audio = document.getElementById('audioPlayer');
            
            if (audio.paused) {
                audio.play();
                isPlaying = true;
            } else {
                audio.pause();
                isPlaying = false;
            }
            
            updatePlayButton();
        }
        
        function updatePlayButton() {
            const btn = document.getElementById('playBtn');
            btn.textContent = isPlaying ? '⏸' : '▶';
        }
        
        // 进度更新
        function updateProgress() {
            const audio = document.getElementById('audioPlayer');
            const progress = (audio.currentTime / audio.duration) * 100;
            
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
            document.getElementById('duration').textContent = formatTime(audio.duration);
        }
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // 进度条点击
        document.getElementById('progressBar').addEventListener('click', function(e) {
            const audio = document.getElementById('audioPlayer');
            const rect = this.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });
        
        // 跳过
        function skipBackward() {
            const audio = document.getElementById('audioPlayer');
            audio.currentTime = Math.max(0, audio.currentTime - 5);
        }
        
        function skipForward() {
            const audio = document.getElementById('audioPlayer');
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
        }
        
        // 速度控制
        function setSpeed(speed) {
            const audio = document.getElementById('audioPlayer');
            audio.playbackRate = speed;
            
            // 更新按钮样式
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        // 历史记录
        function showHistory() {
            document.getElementById('historyModal').classList.add('show');
        }
        
        function closeHistory(event) {
            if (!event || event.target === document.getElementById('historyModal')) {
                document.getElementById('historyModal').classList.remove('show');
            }
        }
        
        function renderHistory(history) {
            const container = document.getElementById('historyList');
            container.innerHTML = '';
            
            history.slice().reverse().forEach(music => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-item-title">${music.meme}</div>
                    <div class="history-item-date">${music.date} · ${music.style}</div>
                `;
                div.onclick = () => {
                    loadMusic(music);
                    closeHistory();
                };
                container.appendChild(div);
            });
        }
        
        // 事件监听
        document.getElementById('audioPlayer').addEventListener('timeupdate', function() {
            updateProgress();
            updateLyrics();
        });
        
        document.getElementById('audioPlayer').addEventListener('ended', function() {
            isPlaying = false;
            updatePlayButton();
        });
        
        document.getElementById('audioPlayer').addEventListener('play', function() {
            isPlaying = true;
            updatePlayButton();
        });
        
        document.getElementById('audioPlayer').addEventListener('pause', function() {
            isPlaying = false;
            updatePlayButton();
        });
        
        // 键盘控制
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.code === 'ArrowLeft') {
                skipBackward();
            } else if (e.code === 'ArrowRight') {
                skipForward();
            }
        });
        
        // 启动
        init();
    </script>
</body>
</html>
