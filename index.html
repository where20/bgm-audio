<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热梗歌词音乐播放器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0D1117 0%, #161B22 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            background: #161B22;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* 左侧：播放器 */
        .player-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: sticky;
            top: 20px;
        }

        .album-art {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 15px;
            overflow: hidden;
            background: #21262D;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 默认封面（无图时显示） */
        .album-art .default-cover {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
            letter-spacing: 4px;
            padding: 20px;
            text-align: center;
            word-break: break-all;
        }

        .album-art .playing-indicator {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(13, 17, 23, 0.85);
            border-radius: 20px;
            padding: 6px 12px;
            display: none;
            align-items: center;
            gap: 4px;
        }

        .album-art .playing-indicator.show {
            display: flex;
        }

        .bar {
            width: 3px;
            background: #58a6ff;
            border-radius: 2px;
            animation: barAnim 0.8s ease-in-out infinite alternate;
        }
        .bar:nth-child(1) { height: 12px; animation-delay: 0s; }
        .bar:nth-child(2) { height: 18px; animation-delay: 0.15s; }
        .bar:nth-child(3) { height: 10px; animation-delay: 0.3s; }
        .bar:nth-child(4) { height: 16px; animation-delay: 0.45s; }

        @keyframes barAnim {
            0% { transform: scaleY(0.4); }
            100% { transform: scaleY(1); }
        }

        .song-info { text-align: center; }

        .song-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-meta {
            font-size: 13px;
            color: #8B949E;
        }

        .progress-container { margin: 8px 0; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #21262D;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #58a6ff, #1f6feb);
            border-radius: 3px;
            width: 0%;
            transition: width 0.15s linear;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8B949E;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #c9d1d9;
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
            line-height: 1;
        }

        .control-btn:hover {
            background: #21262D;
            color: #ffffff;
        }

        .play-btn {
            background: #238636;
            color: #ffffff;
            width: 56px;
            height: 56px;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn:hover {
            background: #2ea043;
        }

        /* 歌词偏移调整 */
        .lyrics-offset-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;          /* 按钮变多后必须允许换行，否则文字被压成竖排 */
            gap: 8px;
            padding: 6px 10px;
            background: #0D1117;
            border-radius: 8px;
            font-size: 12px;
            color: #8B949E;
        }

        .lyrics-offset-bar .offset-label {
            white-space: nowrap;
            min-width: 36px;
            text-align: right;
            color: #58a6ff;
            font-weight: 600;
            font-size: 13px;
        }

        .offset-btn {
            background: #21262D;
            border: 1px solid #30363D;
            color: #c9d1d9;
            cursor: pointer;
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.15s;
            white-space: nowrap;      /* 不换行，否则按钮内的字会被挤成竖排 */
            flex-shrink: 0;
        }

        .offset-btn:hover {
            background: #30363D;
            color: #ffffff;
        }

        .offset-btn:active {
            transform: scale(0.95);
        }

        /* 「应用于全歌」：视觉上要与 ±0.5s 微调按钮区分开，
           这是本次改动里唯一影响 30 首歌的操作，不该长得像调 0.1 秒 */
        .offset-global {
            background: #1f3b5c;
            border-color: #2d5a8a;
            color: #a5d6ff;
        }

        .offset-global:hover {
            background: #2d5a8a;
            color: #ffffff;
        }

        .lyrics-offset-bar .offset-hint {
            color: #484F58;
            font-size: 11px;
            margin-left: auto;
        }

        /* 播放列表工具条（搜索 + 计数） */
        .playlist-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 12px;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            background: #0D1117;
            border: 1px solid #30363D;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            padding: 7px 10px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: #58a6ff;
        }

        .search-input::placeholder {
            color: #484F58;
        }

        .playlist-count {
            font-size: 11px;
            color: #484F58;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* 当前播放不在本页时的提示 */
        .now-playing-tip {
            display: none;
            font-size: 11px;
            color: #f0883e;
            background: rgba(240, 136, 62, 0.1);
            border: 1px solid rgba(240, 136, 62, 0.3);
            border-radius: 6px;
            padding: 6px 8px;
            margin-top: 8px;
            cursor: pointer;
            line-height: 1.5;
        }

        .now-playing-tip.show { display: block; }
        .now-playing-tip:hover { background: rgba(240, 136, 62, 0.18); }

        /* 风格标签：缺失信息显示「未记录」，绝不编造 */
        .pi-style {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 3px;
        }

        .style-tag {
            font-size: 10px;
            line-height: 1.7;
            padding: 0 6px;
            border-radius: 4px;
            background: #21262D;
            color: #8B949E;
            white-space: nowrap;
        }

        .style-tag.missing {
            color: #484F58;
            background: transparent;
            border: 1px dashed #30363D;
        }

        .style-tag.raw {
            background: transparent;
            border: 1px solid #30363D;
            color: #6e7681;
        }

        /* 歌词徽章 */
        .pi-badge {
            font-size: 9px;
            line-height: 1.8;
            padding: 0 5px;
            border-radius: 4px;
            background: rgba(35, 134, 54, 0.2);
            color: #7ee787;
            flex-shrink: 0;
        }

        .pi-badge.nolyric {
            background: rgba(110, 118, 129, 0.16);
            color: #6e7681;
        }

        /* 分页 */
        .pagination {
            display: none;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px solid #21262D;
        }

        .pagination.show { display: flex; }

        .page-btn {
            background: #21262D;
            border: 1px solid #30363D;
            color: #c9d1d9;
            border-radius: 6px;
            min-width: 28px;
            height: 26px;
            padding: 0 7px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .page-btn:hover:not(:disabled) {
            background: #30363D;
            color: #ffffff;
        }

        .page-btn.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #ffffff;
            font-weight: 600;
        }

        .page-btn:disabled {
            opacity: 0.32;
            cursor: not-allowed;
        }

        .page-gap {
            color: #484F58;
            font-size: 12px;
            padding: 0 2px;
        }

        .page-info {
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: #484F58;
            margin-top: 4px;
        }

        /* 歌词行内时间戳（默认隐藏，header 可切换） */
        .lyric-time {
            display: none;
            font-size: 11px;
            color: #30363D;
            font-variant-numeric: tabular-nums;
            margin-right: 10px;
        }

        .lyrics-container.show-time .lyric-time {
            display: inline-block;
        }

        .lyric-line.active .lyric-time {
            color: #58a6ff;
        }

        .lyrics-header .toggle-time {
            margin-left: auto;
            background: #21262D;
            border: 1px solid #30363D;
            color: #8B949E;
            border-radius: 6px;
            padding: 3px 9px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }

        .lyrics-header .toggle-time:hover {
            background: #30363D;
            color: #ffffff;
        }

        .lyrics-header .toggle-time.on {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #ffffff;
        }

        /* 播放列表（左侧下方） */
        .playlist-wrap {
            max-height: 320px;
            overflow-y: auto;
            border-top: 1px solid #21262D;
            padding-top: 8px;
        }

        .playlist-wrap::-webkit-scrollbar { width: 6px; }
        .playlist-wrap::-webkit-scrollbar-track { background: transparent; }
        .playlist-wrap::-webkit-scrollbar-thumb { background: #30363D; border-radius: 3px; }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .playlist-item:hover {
            background: #21262D;
        }

        .playlist-item.active {
            background: rgba(35, 134, 54, 0.15);
            border-left-color: #238636;
        }

        .playlist-item .pi-idx {
            font-size: 12px;
            color: #484F58;
            width: 20px;
            text-align: right;
            flex-shrink: 0;
        }

        .playlist-item.active .pi-idx {
            color: #238636;
        }

        .playlist-item .pi-info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item .pi-name {
            font-size: 13px;
            font-weight: 500;
            color: #c9d1d9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item.active .pi-name {
            color: #ffffff;
        }

        .playlist-item .pi-style {
            font-size: 11px;
            color: #484F58;
        }

        /* 右侧：歌词区域 */
        .lyrics-section {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .lyrics-header {
            font-size: 15px;
            font-weight: 600;
            color: #58a6ff;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .lyrics-container {
            flex: 1;
            min-height: 500px;
            max-height: 70vh;
            overflow-y: auto;
            padding: 40px 16px;
            background: #0D1117;
            border-radius: 12px;
            scroll-behavior: smooth;
            position: relative;
        }

        .lyrics-container::-webkit-scrollbar { width: 6px; }
        .lyrics-container::-webkit-scrollbar-track { background: transparent; }
        .lyrics-container::-webkit-scrollbar-thumb { background: #30363D; border-radius: 3px; }

        .lyric-line {
            padding: 10px 16px;
            margin: 4px 0;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.7;
            color: #484F58;
            transition: all 0.35s ease;
            text-align: center;
            cursor: pointer;
        }

        .lyric-line:hover {
            color: #8B949E;
        }

        .lyric-line.active {
            color: #ffffff;
            background: rgba(88, 166, 255, 0.12);
            font-weight: 600;
            font-size: 18px;
            transform: scale(1.03);
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.3);
        }

        .lyric-line.near {
            color: #8B949E;
        }

        .lyric-line.passed {
            color: #30363D;
        }

        .lyric-line.section-label {
            font-size: 12px;
            color: #238636;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 16px 16px 4px;
        }

        .lyrics-placeholder {
            color: #484F58;
            text-align: center;
            padding: 80px 20px;
            font-size: 15px;
        }

        /* 播放模式 / 音量 / 倍速 */
        .extra-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .control-btn.small {
            font-size: 15px;
            padding: 5px 7px;
            line-height: 1;
        }

        .control-btn.small.active {
            color: #58a6ff;
            background: rgba(88, 166, 255, 0.14);
        }

        .control-btn.speed {
            font-size: 12px;
            font-weight: 600;
            min-width: 46px;
            font-variant-numeric: tabular-nums;
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1 1 90px;
            /* 别让滑块吃掉整行 —— 否则倍速按钮会被挤到边缘（实测过） */
            max-width: 150px;
            min-width: 78px;
        }

        .vol-icon {
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            opacity: 0.85;
        }

        .volume-slider {
            flex: 1;
            min-width: 50px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #21262D;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #58a6ff;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 11px;
            height: 11px;
            border: none;
            border-radius: 50%;
            background: #58a6ff;
            cursor: pointer;
        }

        /* 移动端 Tab（歌词 / 歌单）—— 桌面端隐藏 */
        .mobile-tabs {
            display: none;
            gap: 6px;
            background: #0D1117;
            border-radius: 8px;
            padding: 4px;
        }

        .mtab {
            flex: 1;
            background: none;
            border: none;
            color: #8B949E;
            font-size: 13px;
            font-family: inherit;
            padding: 7px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mtab.active {
            background: #21262D;
            color: #ffffff;
            font-weight: 600;
        }

        /* 键盘可达性：列表项获得焦点时要有明显轮廓 */
        .playlist-item:focus-visible {
            outline: 2px solid #58a6ff;
            outline-offset: -2px;
        }

        .playlist-item:focus {
            background: #21262D;
        }

        /* 键盘上下选中的歌单项（↑↓ + Enter） */
        .playlist-item.kb-selected {
            outline: 2px solid #58a6ff;
            outline-offset: -2px;
            background: rgba(88, 166, 255, 0.08);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 16px;
            }

            .player-section {
                position: static;
            }

            /* ⚠️ 移动端的关键修复：
               原本「歌单」在「歌词」上面，歌词区落在 y≈1141，
               **首屏完全看不到** —— 手机上播放时歌词同步等于白做。
               改成 Tab 切换：播放器固定在上，下面 Tab 切「歌词 / 歌单」。
               桌面端双栏不受影响（.mobile-tabs 在 >768px 时 display:none）。*/
            .mobile-tabs {
                display: flex;
            }

            .playlist-section,
            .lyrics-section {
                display: none;
            }

            .playlist-section.mtab-active {
                display: block;
            }

            .lyrics-section.mtab-active {
                display: flex;
            }

            .lyrics-container {
                min-height: 300px;
                max-height: 60vh;
            }

            .album-art {
                max-width: 280px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧：播放器 + 播放列表 -->
        <div class="player-section">
            <div class="album-art" id="albumArt">
                <div class="default-cover" style="background: linear-gradient(135deg, #238636, #1f6feb);">🎵</div>
                <div class="playing-indicator" id="playingIndicator">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <div class="song-info">
                <div class="song-title" id="songTitle">选择歌曲开始播放</div>
                <div class="song-meta" id="songMeta">热梗歌词音乐</div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="prevBtn" title="上一首">⏮</button>
                <button class="control-btn play-btn" id="playBtn" title="播放">▶</button>
                <button class="control-btn" id="nextBtn" title="下一首">⏭</button>
            </div>

            <!-- 播放模式 / 音量 / 倍速 -->
            <div class="extra-controls">
                <button class="control-btn small" id="shuffleBtn"
                        title="随机播放（打乱顺序，不重复已播）" aria-pressed="false">🔀</button>
                <button class="control-btn small" id="repeatBtn"
                        title="列表循环（点一次=单曲循环，再点=列表循环）">🔁</button>
                <div class="volume-wrap" title="音量">
                    <span class="vol-icon" id="volIcon">🔊</span>
                    <input type="range" id="volumeSlider" class="volume-slider"
                           min="0" max="100" value="100" aria-label="音量">
                </div>
                <button class="control-btn small speed" id="speedBtn"
                        title="播放速度（点击切换）">1.0×</button>
            </div>

            <!-- 歌词偏移调整条 -->
            <div class="lyrics-offset-bar" id="offsetBar">
                <span>⏱ 歌词偏移</span>
                <button class="offset-btn" id="offsetMinus" title="歌词提前0.5秒">-0.5s</button>
                <button class="offset-btn" id="offsetFine" title="微调 0.1 秒">−0.1</button>
                <button class="offset-btn" id="offsetReset" title="重置本曲偏移（不影响全歌偏移）">↺</button>
                <button class="offset-btn" id="offsetFinePlus" title="微调 0.1 秒">+0.1</button>
                <button class="offset-btn" id="offsetPlus" title="歌词延后0.5秒">+0.5s</button>
                <span class="offset-label" id="offsetValue">0.0s</span>
                <button class="offset-btn offset-global" id="offsetApplyAll"
                        title="把当前偏移应用到全部歌曲（适合系统性偏移，一次搞定）">⊕ 全歌</button>
                <span class="offset-hint" id="offsetGlobalHint">快捷键 [ ]</span>
            </div>

            <!-- 移动端 Tab：歌词 / 歌单（桌面端隐藏） -->
            <div class="mobile-tabs" id="mobileTabs" role="tablist" aria-label="内容切换">
                <button class="mtab active" data-tab="lyrics" role="tab" aria-selected="true">🎤 歌词</button>
                <button class="mtab" data-tab="list" role="tab" aria-selected="false">🎵 歌单</button>
            </div>

            <!-- 播放列表 -->
            <div class="playlist-section" id="playlistSection">
                <div class="playlist-toolbar">
                    <input type="text" class="search-input" id="searchInput"
                           placeholder="搜索歌名 / 风格 / 日期…" autocomplete="off" spellcheck="false">
                    <span class="playlist-count" id="playlistCount"></span>
                </div>
                <div class="now-playing-tip" id="nowPlayingTip"></div>
                <div class="playlist-wrap" id="playlist" role="listbox" aria-label="歌曲列表">
                    <div class="lyrics-placeholder">加载中...</div>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>

        <!-- 右侧：歌词 -->
        <div class="lyrics-section" id="lyricsSection">
            <div class="lyrics-header">
                🎤 歌词同步滚动
                <button class="toggle-time" id="toggleTime" title="显示/隐藏每行的时间戳">⏱ 时间轴</button>
            </div>
            <div class="lyrics-container" id="lyricsContainer" aria-live="polite" aria-atomic="false">
                <div class="lyrics-placeholder">点击左侧歌曲开始播放<br>歌词将自动滚动高亮</div>
            </div>
        </div>
    </div>

    <script>
        // ===== 全局状态 =====
        let audio = new Audio();
        let currentSongIndex = -1;
        let songs = [];
        let lyricsData = [];     // [{ time, text, isLabel }]
        let isPlaying = false;
        let lastActiveIndex = -1;
        let lyricsOffset = 0;    // 本曲偏移量（秒）
        let globalOffset = 0;    // 全歌偏移量（秒）—— 系统性偏差用这个，一次调好全部生效
        const OFFSET_KEY = 'bgm_lyrics_offset_';
        const GLOBAL_OFFSET_KEY = 'bgm_lyrics_global_offset';

        // ===== 分页 / 搜索 =====
        const PAGE_SIZE = 20;        // 每页 20 首（128 首 → 7 页）
        let currentPage = 1;
        let searchQuery = '';
        let searchTimer = null;

        // ===== 歌词同步 =====
        let rafId = null;            // requestAnimationFrame 句柄
        const FORCED = -2;           // lastActiveIndex 哨兵：强制刷新高亮

        // ===== 播放模式 =====
        // list = 列表循环（默认）/ one = 单曲循环 / shuffle = 随机不重复
        let playMode = 'list';
        let shufflePlayed = new Set();
        const MODE_KEY = 'bgm_play_mode';

        // ===== 音量 / 倍速 =====
        let speed = 1;
        const SPEEDS = [1, 1.25, 1.5, 0.75, 0.5];
        const VOL_KEY = 'bgm_volume';
        let lastVolume = 1;

        // ===== 键盘导航 =====
        let kbIndex = -1;            // 当前页内键盘选中的下标

        // ===== 移动端 Tab =====
        let mobileTab = 'list';      // 'list' | 'lyrics'
        const TAB_KEY = 'bgm_mobile_tab';

        // 封面图渐变色方案（按歌曲索引轮换）
        const coverGradients = [
            ['#e85d3a', '#c23065'],  // 橙红
            ['#1f6feb', '#58a6ff'],  // 蓝
            ['#238636', '#2ea043'],  // 绿
            ['#8b5cf6', '#d946ef'],  // 紫粉
            ['#f59e0b', '#ef4444'],  // 金红
            ['#06b6d4', '#3b82f6'],  // 青蓝
            ['#ec4899', '#f43f5e'],  // 粉红
            ['#10b981', '#059669'],  // 翡翠
            ['#6366f1', '#a855f7'],  // 靛紫
        ];

        // ===== 初始化 =====
        async function init() {
            await loadPlaylist();
            renderPlaylist();

            document.getElementById('playBtn').addEventListener('click', togglePlay);
            document.getElementById('prevBtn').addEventListener('click', playPrev);
            document.getElementById('nextBtn').addEventListener('click', playNext);
            document.getElementById('progressBar').addEventListener('click', seek);

            // 搜索：输入去抖 180ms，避免每敲一个字就重排 128 首
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimer);
                const val = e.target.value;
                searchTimer = setTimeout(() => {
                    searchQuery = val;
                    currentPage = 1;
                    renderPlaylist();
                    updatePlaylistHighlight();
                }, 180);
            });
            // 回车立刻生效（不等去抖）
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    clearTimeout(searchTimer);
                    searchQuery = e.target.value;
                    currentPage = 1;
                    renderPlaylist();
                    updatePlaylistHighlight();
                }
            });

            // 歌词时间戳开关
            document.getElementById('toggleTime').addEventListener('click', (e) => {
                const c = document.getElementById('lyricsContainer');
                const on = c.classList.toggle('show-time');
                e.target.classList.toggle('on', on);
            });

            // 播放模式（随机 / 循环）
            document.getElementById('shuffleBtn').addEventListener('click', toggleShuffle);
            document.getElementById('repeatBtn').addEventListener('click', cycleRepeat);
            loadPlayMode();

            // 音量
            const vol = document.getElementById('volumeSlider');
            const v0 = loadVolume();
            vol.value = String(Math.round(v0 * 100));
            audio.volume = v0;
            lastVolume = v0 > 0 ? v0 : 1;
            vol.addEventListener('input', (e) => {
                const v = Number(e.target.value) / 100;
                audio.volume = v;
                if (v > 0) lastVolume = v;
                saveVolume(v);
                updateVolIcon();
            });
            document.getElementById('volIcon').addEventListener('click', toggleMute);
            updateVolIcon();

            // 倍速
            document.getElementById('speedBtn').addEventListener('click', cycleSpeed);

            // 移动端 Tab：桌面端两个区都显示，≤768px 时用 Tab 切换
            document.querySelectorAll('.mtab').forEach(b => {
                b.addEventListener('click', () => switchTab(b.dataset.tab));
            });
            applyTabMode();
            window.addEventListener('resize', applyTabMode);

            // 偏移控制
            document.getElementById('offsetMinus').addEventListener('click', () => adjustOffset(-0.5));
            document.getElementById('offsetPlus').addEventListener('click', () => adjustOffset(0.5));
            document.getElementById('offsetFine').addEventListener('click', () => adjustOffset(-0.1));
            document.getElementById('offsetFinePlus').addEventListener('click', () => adjustOffset(0.1));
            document.getElementById('offsetReset').addEventListener('click', () => {
                lyricsOffset = 0; saveOffset(); updateOffsetDisplay();
            });
            // 「应用于全歌」：把 (全局 + 本曲) 的当前值固化为全局，并清掉所有 per-song 偏移。
            // 起因：用户反馈偏移是**系统性**的（大部分歌方向一致），而原实现是 per-song
            // 存的，30 首要各调一次，实际等于没法调。
            document.getElementById('offsetApplyAll').addEventListener('click', () => {
                const total = clampOffset(globalOffset + lyricsOffset);
                globalOffset = total;
                lyricsOffset = 0;
                try {
                    localStorage.setItem(GLOBAL_OFFSET_KEY, String(total));
                    Object.keys(localStorage)
                        .filter(k => k.startsWith(OFFSET_KEY))
                        .forEach(k => localStorage.removeItem(k));
                } catch (e) {}
                updateOffsetDisplay();
                alert(`已把 ${total >= 0 ? '+' : ''}${total.toFixed(1)}s 应用到全部歌曲。\n`
                      + `本曲偏移已归零，切歌后依然生效。\n\n`
                      + `如需撤销：在控制台执行 localStorage.removeItem('${GLOBAL_OFFSET_KEY}') 后刷新。`);
            });

            globalOffset = loadGlobalOffset();
            updateOffsetDisplay();     // 初始化就显示全歌偏移（未选歌时也能看到）

            // 清除所有歌词偏移量（开发者功能）
            window.clearAllLyricsOffset = function() {
                const keys = Object.keys(localStorage).filter(k => k.startsWith(OFFSET_KEY));
                keys.forEach(k => localStorage.removeItem(k));
                try { localStorage.removeItem(GLOBAL_OFFSET_KEY); } catch (e) {}
                globalOffset = 0; lyricsOffset = 0;
                updateOffsetDisplay();
                alert(`已清除 ${keys.length} 个单曲偏移与全歌偏移，请刷新页面`);
            };
            console.log('💡 执行 clearAllLyricsOffset() 可清除所有歌词偏移量（含全歌偏移）');

            audio.addEventListener('timeupdate', onTimeUpdate);
            audio.addEventListener('loadedmetadata', updateDuration);
            audio.addEventListener('ended', () => playNext(true));
            audio.addEventListener('play', () => {
                isPlaying = true;
                document.getElementById('playBtn').textContent = '⏸';
                document.getElementById('playingIndicator').classList.add('show');
                startSyncLoop();
            });
            audio.addEventListener('pause', () => {
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶';
                document.getElementById('playingIndicator').classList.remove('show');
                stopSyncLoop();
            });
        }

        // ===== 歌词同步主循环（requestAnimationFrame） =====
        // 为什么不用 timeupdate 撑着：timeupdate 实测约 4Hz（250ms 一次），
        // 副歌快唱时高亮会明显滞后半拍，歌词「跟不上歌」的感觉就是这么来的。
        // 改成自己按帧轮询 currentTime，同步精度提到帧级（~16ms）。
        function startSyncLoop() {
            if (rafId) return;
            const tick = () => {
                updateLyricsHighlight();
                updateProgressBar();
                rafId = isPlaying ? requestAnimationFrame(tick) : null;
            };
            rafId = requestAnimationFrame(tick);
        }

        function stopSyncLoop() {
            if (rafId) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
        }

        // ===== 加载播放列表 =====
        async function loadPlaylist() {
            try {
                // 🚫 必须绕过缓存，否则改了 music.json 用户看不到。
                // 实测响应头：music.json 有 `cache-control: max-age=600`（CDN 缓存
                // 10 分钟）；.lrc 连 cache 头都没有，走启发式缓存（基于 Last-Modified
                // 的 10%），改过时间轴的歌词可能缓存好几天。
                // `_=` 时间戳 + no-store 双保险。
                const response = await fetch('music.json?_=' + Date.now(),
                                             { cache: 'no-store' });
                const data = await response.json();
                songs = data.playlist || [];
            } catch (error) {
                console.error('加载播放列表失败:', error);
            }
        }

        // ===== 转义（歌名可能含 < > &，直接塞 innerHTML 会破坏 DOM） =====
        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ===== 风格解析（canonical-v1: 流派中文(节奏,性别中文)） =====
        // 数据层只写「确实记录了」的部分，缺失的**不编造**，
        // 交给 UI 层降级成「未记录」—— 诚实比好看重要。
        const GENRES = ['Pop流行', 'R&B节奏蓝调', 'Rock摇滚', 'Folk-Pop民谣',
                        'Electronic电子', 'City-Pop都市', 'Indie独立'];
        const TEMPOS = ['A慢热型', 'B中速型', 'C波浪型', 'D渐进型', 'E流行抒情'];

        function parseStyle(style) {
            const out = { genre: '', tempo: '', gender: '' };
            if (!style) return out;
            const s = String(style);
            for (const g of GENRES) { if (s.includes(g)) { out.genre = g; break; } }
            for (const t of TEMPOS) { if (s.includes(t)) { out.tempo = t; break; } }
            if (/女声/.test(s)) out.gender = '女声';
            else if (/男声/.test(s)) out.gender = '男声';
            return out;
        }

        function renderStyleTags(style) {
            const raw = style ? String(style).trim() : '';
            const p = parseStyle(raw);
            if (!p.genre && !p.tempo && !p.gender) {
                // 完全认不出来：有原文就原样展示（不丢信息），没原文就标未记录
                return raw
                    ? `<span class="style-tag raw">${escapeHtml(raw)}</span>`
                    : `<span class="style-tag missing">未记录</span>`;
            }
            const slots = [p.genre, p.tempo, p.gender];
            return slots.map(v => v
                ? `<span class="style-tag">${escapeHtml(v)}</span>`
                : `<span class="style-tag missing">未记录</span>`).join('');
        }

        // ===== 播放列表视图（搜索过滤 + 分页） =====
        // 返回 [{song, index}]，index 是歌曲在 songs 里的**真实**下标，
        // 分页/搜索都只影响显示，不影响播放目标。
        function getViewList() {
            const q = (searchQuery || '').trim().toLowerCase();
            const all = songs.map((s, i) => ({ song: s, index: i }));
            if (!q) return all;
            return all.filter(({ song }) => {
                const hay = [song.meme, song.style, song.date, song.id]
                    .filter(Boolean).join(' ').toLowerCase();
                return hay.includes(q);
            });
        }

        // ===== 渲染播放列表 =====
        function renderPlaylist() {
            const el = document.getElementById('playlist');
            const view = getViewList();
            const totalPages = Math.max(1, Math.ceil(view.length / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageItems = view.slice(start, start + PAGE_SIZE);

            el.innerHTML = '';
            if (view.length === 0) {
                el.innerHTML = '<div class="lyrics-placeholder">没有匹配的歌<br>换个关键词试试</div>';
            } else {
                pageItems.forEach(({ song, index }) => {
                    const item = document.createElement('div');
                    item.className = 'playlist-item';
                    item.dataset.songIndex = String(index);
                    // 可聚焦 + role，键盘用户能 Tab 进来、回车播放
                    item.tabIndex = 0;
                    item.setAttribute('role', 'option');
                    item.setAttribute('aria-selected', 'false');
                    item.onclick = () => { resetKeyboardSelection(); playSong(index); };
                    item.onkeydown = (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            e.stopPropagation();
                            playSong(index);
                        }
                    };
                    const hasLyric = !!(song.lyrics && String(song.lyrics).trim());
                    item.innerHTML = `
                        <span class="pi-idx">${index + 1}</span>
                        <div class="pi-info">
                            <div class="pi-name">${escapeHtml(song.meme)}</div>
                            <div class="pi-style">${renderStyleTags(song.style)}</div>
                        </div>
                        <span class="pi-badge${hasLyric ? '' : ' nolyric'}"
                              title="${hasLyric ? '有同步歌词' : '暂无歌词'}">${hasLyric ? '词' : '无词'}</span>
                    `;
                    el.appendChild(item);
                });
            }

            // 计数：全部 N 首 / 筛选出 M 首
            const countEl = document.getElementById('playlistCount');
            if (countEl) {
                countEl.textContent = (searchQuery || '').trim()
                    ? `${view.length}/${songs.length}`
                    : `${songs.length} 首`;
            }

            renderPagination(totalPages, view.length);
        }

        // ===== 分页控件 =====
        function renderPagination(totalPages, viewLen) {
            const p = document.getElementById('pagination');
            if (!p) return;
            p.innerHTML = '';
            if (totalPages <= 1) {
                p.classList.remove('show');
                return;
            }
            p.classList.add('show');

            const mk = (label, page, opts = {}) => {
                const b = document.createElement('button');
                b.className = 'page-btn' + (opts.active ? ' active' : '');
                b.textContent = label;
                b.disabled = !!opts.disabled;
                if (!opts.disabled) b.onclick = () => goToPage(page);
                p.appendChild(b);
            };

            mk('‹', currentPage - 1, { disabled: currentPage === 1 });

            // 页码：首尾 + 当前页附近，中间用省略号
            const pages = new Set([1, totalPages]);
            for (let i = currentPage - 1; i <= currentPage + 1; i++) {
                if (i >= 1 && i <= totalPages) pages.add(i);
            }
            const sorted = [...pages].sort((a, b) => a - b);
            let prev = 0;
            sorted.forEach(pg => {
                if (prev && pg - prev > 1) {
                    const g = document.createElement('span');
                    g.className = 'page-gap';
                    g.textContent = '…';
                    p.appendChild(g);
                }
                mk(String(pg), pg, { active: pg === currentPage });
                prev = pg;
            });

            mk('›', currentPage + 1, { disabled: currentPage === totalPages });

            const info = document.createElement('div');
            info.className = 'page-info';
            info.textContent = `第 ${currentPage} / ${totalPages} 页 · 共 ${viewLen} 首`;
            p.appendChild(info);
        }

        function goToPage(n) {
            currentPage = n;
            renderPlaylist();
            updatePlaylistHighlight();
        }

        // 当前曲不在当前页时，自动翻到它所在页
        function ensureCurrentVisible() {
            if (currentSongIndex < 0) return;
            const view = getViewList();
            const pos = view.findIndex(v => v.index === currentSongIndex);
            if (pos < 0) return;
            const page = Math.floor(pos / PAGE_SIZE) + 1;
            if (page !== currentPage) {
                currentPage = page;
                renderPlaylist();
            }
        }

        // ===== 解析音频URL（支持相对路径自动转CDN） =====
        function resolveAudioUrl(path) {
            if (!path) return '';
            if (path.startsWith('http')) return path;
            // 相对路径转为CDN URL（使用最新commit）
            return 'https://cdn.jsdelivr.net/gh/where20/bgm-audio@gh-pages/' + path;
        }

        // ===== 解析封面URL =====
        function resolveImageUrl(path) {
            if (!path) return '';
            if (path.startsWith('http')) return path;
            // 相对路径转为CDN URL
            return 'https://cdn.jsdelivr.net/gh/where20/bgm-audio@gh-pages/' + path;
        }

        // ===== 设置封面图（带容错） =====
        function setAlbumArt(song, index) {
            const albumArt = document.getElementById('albumArt');
            const indicator = document.getElementById('playingIndicator');
            const imgSrc = resolveImageUrl(song.image);

            if (imgSrc) {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = song.meme;
                img.onerror = function() {
                    // 封面加载失败，显示默认渐变封面
                    showDefaultCover(albumArt, song.meme, index);
                };
                img.onload = function() {
                    albumArt.innerHTML = '';
                    albumArt.appendChild(img);
                    albumArt.appendChild(indicator);
                };
                // 先显示默认封面，图片加载完后替换
                showDefaultCover(albumArt, song.meme, index);
                // 触发加载
                img.src = imgSrc;
            } else {
                showDefaultCover(albumArt, song.meme, index);
            }
        }

        function showDefaultCover(container, text, index) {
            const indicator = document.getElementById('playingIndicator');
            const grad = coverGradients[index % coverGradients.length];
            container.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'default-cover';
            div.style.background = `linear-gradient(135deg, ${grad[0]}, ${grad[1]})`;
            div.textContent = text || '🎵';
            container.appendChild(div);
            container.appendChild(indicator);
        }

        // ===== 播放歌曲 =====
        // ===== 歌词加载：兼容「内嵌文本」与「独立 .lrc 文件」两种形态 =====
        // 2026-10-18 起 music.json 只存相对路径(lyrics/<id>.lrc)，歌词实体在仓内独立文件。
        // 内嵌形态保留兼容，便于灰度回滚。
        let lyricsLoadToken = 0;
        // 歌词文本内存缓存（路径 -> 内容）。配合 fetch 的 no-store 使用：
        // 每次页面打开都拿最新的歌词，但同一首歌在本次会话内只下载一次。
        const lyricTextCache = new Map();

        async function loadSongLyrics(song) {
            const raw = (song && song.lyrics) || '';
            const text = String(raw).trim();

            if (!text) {
                lyricsData = [];
                renderLyrics();
                return;
            }

            // 形态判断：以 '[' 开头视为内嵌 LRC 文本，否则视为相对路径
            if (text.startsWith('[')) {
                parseLyrics(text);
                return;
            }

            const token = ++lyricsLoadToken;
            // 内存缓存：既绕过 CDN 缓存（.lrc 无 cache 头，走启发式缓存可能
            // 命中好几天，改过的歌词用户看不到），又不会反复下载同一首。
            if (lyricTextCache.has(text)) {
                parseLyrics(lyricTextCache.get(text));
                return;
            }
            try {
                // encodeURI：文件名含中文（如 塑料袋子舞_20261018.lrc）
                const res = await fetch(encodeURI(text) + '?_=' + Date.now(),
                                        { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const body = await res.text();
                lyricTextCache.set(text, body);
                if (token !== lyricsLoadToken) return;   // 已切歌，丢弃过期结果
                parseLyrics(body);
            } catch (e) {
                console.warn('歌词文件加载失败:', text, e);
                if (token === lyricsLoadToken) {
                    lyricsData = [{ time: 0, text: '歌词加载失败', isLabel: false }];
                    renderLyrics();
                }
            }
        }

        async function playSong(index, fromAuto = false) {
            if (index < 0 || index >= songs.length) return;

            currentSongIndex = index;
            const song = songs[index];

            // 随机模式下用户主动选歌 → 重置已播集合（自动连播时不重置）
            if (playMode === 'shuffle' && !fromAuto) {
                shufflePlayed.clear();
                shufflePlayed.add(index);
            }

            audio.src = resolveAudioUrl(song.audio);
            audio.load();
            audio.playbackRate = speed;      // 倍速要在 load 之后重设，否则被重置成 1
            audio.volume = audio.volume;     // 音量同理

            document.getElementById('songTitle').textContent = song.meme;
            document.getElementById('songMeta').textContent = `${song.style || ''} · ${song.date}`;

            // 设置封面图
            setAlbumArt(song, index);

            // 加载偏移量
            lyricsOffset = loadOffset(song.id || song.meme);
            updateOffsetDisplay();

            // 分页后，正在播的歌可能不在当前页 —— 自动翻过去
            ensureCurrentVisible();
            updatePlaylistHighlight();
            resetKeyboardSelection();

            // 移动端：点歌就是为了听 → 切到歌词页（否则歌词在屏幕外看不见）
            if (isMobile()) switchTab('lyrics');

            // 歌词可能是异步拉取，先给个占位再等它
            document.getElementById('lyricsContainer').innerHTML =
                '<div class="lyrics-placeholder">加载歌词…</div>';
            lastActiveIndex = FORCED;
            await loadSongLyrics(song);
            // 歌词到位后立刻刷新一次高亮（否则首帧还是空白）
            lastActiveIndex = FORCED;
            updateLyricsHighlight();

            prefetchNext();

            try {
                await audio.play();
            } catch (e) {
                console.warn('自动播放被阻止，请手动点击播放');
            }
        }

        // ===== 歌词偏移量管理 =====
        // 两级：globalOffset 作用于全部歌曲（系统性偏差），lyricsOffset 只作用于本曲（个别歌曲微调）。
        function clampOffset(v) {
            return Math.max(-5, Math.min(5, Math.round(v * 10) / 10));
        }

        function loadGlobalOffset() {
            try {
                const val = localStorage.getItem(GLOBAL_OFFSET_KEY);
                return val ? clampOffset(parseFloat(val)) : 0;
            } catch (e) { return 0; }
        }

        function loadOffset(songId) {
            try {
                const val = localStorage.getItem(OFFSET_KEY + songId);
                return val ? parseFloat(val) : 0;
            } catch(e) { return 0; }
        }

        function saveOffset() {
            if (currentSongIndex < 0) return;
            const song = songs[currentSongIndex];
            try {
                localStorage.setItem(OFFSET_KEY + (song.id || song.meme), lyricsOffset.toString());
            } catch(e) {}
        }

        function adjustOffset(delta) {
            lyricsOffset = clampOffset(lyricsOffset + delta);
            saveOffset();
            updateOffsetDisplay();
        }

        function updateOffsetDisplay() {
            const el = document.getElementById('offsetValue');
            const hint = document.getElementById('offsetGlobalHint');
            const total = globalOffset + lyricsOffset;
            el.textContent = (total >= 0 ? '+' : '') + total.toFixed(1) + 's';
            el.style.color = total === 0 ? '#58a6ff' : (total > 0 ? '#f0883e' : '#a5d6ff');
            el.title = `全歌偏移 ${globalOffset.toFixed(1)}s + 本曲偏移 ${lyricsOffset.toFixed(1)}s`;
            if (hint) {
                const parts = ['快捷键 [ ]'];
                if (globalOffset !== 0) parts.push(`全歌 ${globalOffset > 0 ? '+' : ''}${globalOffset.toFixed(1)}s 已生效`);
                if (lyricsOffset !== 0) parts.push(`本曲 ${lyricsOffset > 0 ? '+' : ''}${lyricsOffset.toFixed(1)}s`);
                hint.textContent = parts.join(' · ');
            }
        }

        // ===== 歌词解析（核心 - 修复版） =====
        function parseLyrics(lyricsText) {
            lyricsData = [];

            if (!lyricsText || lyricsText === '歌词时间戳') {
                lyricsData = [{ time: 0, text: '暂无歌词', isLabel: false }];
                renderLyrics();
                return;
            }

            // 清理markdown标记
            let cleaned = lyricsText
                .replace(/```[\s\S]*?```/g, '')  // 移除代码块
                .replace(/\*\*\[([^\]]+)\]\*\*/g, '[$1]')  // **[Label]** → [Label]
                .replace(/\*\*/g, '');

            const lines = cleaned.split('\n');

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                // 匹配 [MM:SS.mm] 或 [MM:SS] 格式
                const tsRegex = /^\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/;
                const match = line.match(tsRegex);

                if (match) {
                    const minutes = parseInt(match[1], 10);
                    const seconds = parseInt(match[2], 10);
                    // 修复毫秒解析：确保3位精度
                    let ms = 0;
                    if (match[3]) {
                        const raw = match[3];
                        if (raw.length === 1) ms = parseInt(raw, 10) * 100;        // .5 → 500ms
                        else if (raw.length === 2) ms = parseInt(raw, 10) * 10;   // .50 → 500ms
                        else ms = parseInt(raw, 10);                                 // .500 → 500ms
                    }
                    const time = minutes * 60 + seconds + ms / 1000;
                    let text = match[4].trim();

                    // 清理嵌套标签 如 [Verse 1][慢节奏]歌词
                    const nestedTag = text.match(/^\[([^\]]+)\](.*)/);
                    if (nestedTag) {
                        const label = nestedTag[1].trim();
                        const rest = nestedTag[2].trim();
                        if (!rest) {
                            lyricsData.push({ time, text: `♫ ${label}`, isLabel: true });
                            return;
                        }
                        text = rest;
                    }

                    // 清理剩余括号标签
                    text = text.replace(/\[([^\]]+)\]/g, '').trim();

                    if (text && !text.startsWith('（') || text.length > 4) {
                        lyricsData.push({ time, text, isLabel: false });
                    } else if (text) {
                        lyricsData.push({ time, text, isLabel: true });
                    }
                }
                else if (/^\[[^\d\]]+\]$/.test(line)) {
                    const label = line.slice(1, -1).trim();
                    lyricsData.push({ time: null, text: `♫ ${label}`, isLabel: true });
                }
            });

            // 排序
            lyricsData.sort((a, b) => {
                if (a.time === null && b.time === null) return 0;
                if (a.time === null) return 1;
                if (b.time === null) return -1;
                return a.time - b.time;
            });

            // 去重
            const seen = new Set();
            lyricsData = lyricsData.filter(l => {
                if (l.time === null) return true;
                const key = l.time.toFixed(2);
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            renderLyrics();
        }

        // ===== 渲染歌词 =====
        function renderLyrics() {
            const container = document.getElementById('lyricsContainer');
            container.innerHTML = '';

            if (lyricsData.length === 0) {
                container.innerHTML = '<div class="lyrics-placeholder">暂无歌词</div>';
                return;
            }

            lyricsData.forEach((lyric, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line' + (lyric.isLabel ? ' section-label' : '');

                // 时间戳（默认隐藏，点 header 的「⏱ 时间轴」显示）
                if (lyric.time !== null && !lyric.isLabel) {
                    const ts = document.createElement('span');
                    ts.className = 'lyric-time';
                    ts.textContent = formatTime(lyric.time);
                    div.appendChild(ts);
                }
                const txt = document.createElement('span');
                txt.className = 'lyric-text';
                txt.textContent = lyric.text;
                div.appendChild(txt);

                div.dataset.index = index;
                if (lyric.time !== null) {
                    div.addEventListener('click', () => {
                        audio.currentTime = lyric.time;
                        // 跳过去后立刻重算高亮，不用等下一个 timeupdate
                        lastActiveIndex = FORCED;
                        updateLyricsHighlight();
                    });
                }
                container.appendChild(div);
            });
        }

        // ===== 歌词高亮更新（核心 - 加入偏移量） =====
        function updateLyricsHighlight() {
            if (lyricsData.length === 0) return;

            // 应用偏移量：偏移 > 0 表示歌词需要延后显示 = 用更早的时间匹配。
            // 全歌偏移（系统性偏差）与本曲偏移（个别微调）相加后统一生效。
            const effectiveTime = audio.currentTime - (globalOffset + lyricsOffset);
            let activeIndex = -1;

            for (let i = lyricsData.length - 1; i >= 0; i--) {
                if (lyricsData[i].time !== null && lyricsData[i].time <= effectiveTime) {
                    activeIndex = i;
                    break;
                }
            }

            if (activeIndex === lastActiveIndex) return;
            lastActiveIndex = activeIndex;

            const lines = document.querySelectorAll('.lyric-line');
            lines.forEach((line, index) => {
                line.classList.remove('active', 'near', 'passed');

                if (index === activeIndex) {
                    line.classList.add('active');
                    line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else if (index >= activeIndex - 2 && index <= activeIndex + 2) {
                    line.classList.add('near');
                } else if (index < activeIndex) {
                    line.classList.add('passed');
                }
            });
        }

        // ===== 播放控制 =====
        function togglePlay() {
            if (currentSongIndex === -1) {
                playSong(0);
                return;
            }
            if (isPlaying) { audio.pause(); } else { audio.play(); }
        }

        // ===== 移动端 Tab（歌词 / 歌单） =====
        function isMobile() {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        function switchTab(tab) {
            mobileTab = tab;
            try { localStorage.setItem(TAB_KEY, tab); } catch (e) { /* 忽略 */ }
            document.querySelectorAll('.mtab').forEach(b => {
                const on = b.dataset.tab === tab;
                b.classList.toggle('active', on);
                b.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            document.getElementById('playlistSection')
                .classList.toggle('mtab-active', tab === 'list');
            document.getElementById('lyricsSection')
                .classList.toggle('mtab-active', tab === 'lyrics');
        }

        // 桌面端不需要 Tab（两个区都显示）；切回桌面时把 mtab-active 清掉
        function applyTabMode() {
            if (isMobile()) {
                // 记住上次选的那个 Tab
                try {
                    const t = localStorage.getItem(TAB_KEY);
                    if (t === 'list' || t === 'lyrics') mobileTab = t;
                } catch (e) { /* 忽略 */ }
                switchTab(mobileTab);
            } else {
                document.getElementById('playlistSection').classList.remove('mtab-active');
                document.getElementById('lyricsSection').classList.remove('mtab-active');
            }
        }

        // ===== 播放模式 =====
        function loadPlayMode() {
            try {
                const m = localStorage.getItem(MODE_KEY);
                if (m === 'one' || m === 'shuffle') playMode = m;
            } catch (e) { /* 忽略 */ }
            updateModeButtons();
        }

        function savePlayMode() {
            try { localStorage.setItem(MODE_KEY, playMode); } catch (e) { /* 忽略 */ }
        }

        function updateModeButtons() {
            const sh = document.getElementById('shuffleBtn');
            const rp = document.getElementById('repeatBtn');
            const isShuffle = playMode === 'shuffle';
            sh.classList.toggle('active', isShuffle);
            sh.setAttribute('aria-pressed', isShuffle ? 'true' : 'false');
            sh.title = isShuffle ? '随机播放中（点击关闭）'
                                : '随机播放（打乱顺序，不重复已播）';
            if (playMode === 'one') {
                rp.textContent = '🔂';
                rp.title = '单曲循环（点击切回列表循环）';
                rp.classList.add('active');
            } else {
                rp.textContent = '🔁';
                rp.title = '列表循环（点一次=单曲循环，再点=列表循环）';
                rp.classList.remove('active');
            }
        }

        function toggleShuffle() {
            playMode = (playMode === 'shuffle') ? 'list' : 'shuffle';
            shufflePlayed.clear();
            if (playMode === 'shuffle' && currentSongIndex >= 0) {
                shufflePlayed.add(currentSongIndex);
            }
            savePlayMode();
            updateModeButtons();
        }

        function cycleRepeat() {
            playMode = (playMode === 'one') ? 'list' : 'one';
            savePlayMode();
            updateModeButtons();
        }

        // 随机：已播过的不再播；全播完一轮后重开
        function nextShuffleIndex() {
            if (shufflePlayed.size >= songs.length) shufflePlayed.clear();
            const pool = [];
            for (let i = 0; i < songs.length; i++) {
                if (!shufflePlayed.has(i)) pool.push(i);
            }
            if (!pool.length) return currentSongIndex;
            const pick = pool[Math.floor(Math.random() * pool.length)];
            shufflePlayed.add(pick);
            return pick;
        }

        // ===== 音量 / 倍速 =====
        function loadVolume() {
            try {
                const v = parseFloat(localStorage.getItem(VOL_KEY));
                return isNaN(v) ? 1 : Math.max(0, Math.min(1, v));
            } catch (e) { return 1; }
        }

        function saveVolume(v) {
            try { localStorage.setItem(VOL_KEY, String(v)); } catch (e) { /* 忽略 */ }
        }

        function updateVolIcon() {
            const el = document.getElementById('volIcon');
            const v = audio.volume;
            el.textContent = v === 0 ? '🔇' : (v < 0.5 ? '🔉' : '🔊');
        }

        function toggleMute() {
            if (audio.volume > 0) {
                lastVolume = audio.volume;
                audio.volume = 0;
            } else {
                audio.volume = lastVolume || 1;
            }
            document.getElementById('volumeSlider').value =
                String(Math.round(audio.volume * 100));
            saveVolume(audio.volume);
            updateVolIcon();
        }

        function cycleSpeed() {
            const i = SPEEDS.indexOf(speed);
            speed = SPEEDS[(i + 1) % SPEEDS.length];
            audio.playbackRate = speed;
            document.getElementById('speedBtn').textContent = speed + '×';
        }

        // ===== 键盘导航（在当前页内上下选歌） =====
        function moveKeyboardSelection(delta) {
            const items = Array.from(document.querySelectorAll('.playlist-item'));
            if (!items.length) return;
            if (kbIndex < 0) kbIndex = 0;
            else kbIndex = Math.max(0, Math.min(items.length - 1, kbIndex + delta));
            items.forEach((el, i) => el.classList.toggle('kb-selected', i === kbIndex));
            items[kbIndex].scrollIntoView({ block: 'nearest' });
        }

        function resetKeyboardSelection() {
            kbIndex = -1;
            document.querySelectorAll('.playlist-item.kb-selected')
                .forEach(el => el.classList.remove('kb-selected'));
        }

        // 预取下一首的音频 → 切歌时不用等
        function prefetchNext() {
            if (currentSongIndex < 0) return;
            const nextIdx = (currentSongIndex + 1) % songs.length;
            const nxt = songs[nextIdx];
            if (!nxt || !nxt.audio) return;
            try {
                const pre = new Audio();
                pre.preload = 'auto';
                pre.src = resolveAudioUrl(nxt.audio);
            } catch (e) { /* 忽略 */ }
        }

        function playPrev() {
            if (currentSongIndex > 0) playSong(currentSongIndex - 1);
        }

        function playNext(fromAuto = false) {
            if (!songs.length) return;
            if (playMode === 'one' && fromAuto) {
                audio.currentTime = 0;
                audio.play();
                return;
            }
            let idx;
            if (playMode === 'shuffle') {
                idx = nextShuffleIndex();
            } else {
                idx = (currentSongIndex + 1) % songs.length;   // 列表循环
            }
            if (idx >= 0 && idx < songs.length) playSong(idx, fromAuto);
        }

        // ===== 进度更新 =====
        function onTimeUpdate() {
            // 兜底：timeupdate 只有 ~4Hz，主同步靠 rAF 循环
            updateProgressBar();
            updateLyricsHighlight();
        }

        function updateProgressBar() {
            if (!audio.duration) return;
            const pct = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress').style.width = pct + '%';
            document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        }

        function updateDuration() {
            document.getElementById('duration').textContent = formatTime(audio.duration);
        }

        function seek(e) {
            if (!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = Math.max(0, Math.min(pct * audio.duration, audio.duration));
            // 拖动进度条后立刻重算高亮，否则要等一个 tick 才跳到对应歌词
            lastActiveIndex = FORCED;
            updateLyricsHighlight();
            updateProgressBar();
        }

        function formatTime(s) {
            if (isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + String(sec).padStart(2, '0');
        }

        // ===== 播放列表高亮 =====
        function updatePlaylistHighlight() {
            // 分页后 DOM 顺序 ≠ songs 下标，必须用 data-song-index 对齐
            document.querySelectorAll('.playlist-item').forEach(item => {
                const idx = Number(item.dataset.songIndex);
                const on = idx === currentSongIndex;
                item.classList.toggle('active', on);
                item.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            const activeItem = document.querySelector('.playlist-item.active');
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            updateNowPlayingTip();
        }

        // 当前曲不在本页 / 被搜索过滤掉时，顶部给一条可点击的提示
        function updateNowPlayingTip() {
            const tip = document.getElementById('nowPlayingTip');
            if (!tip) return;
            if (currentSongIndex < 0) {
                tip.classList.remove('show');
                return;
            }
            const view = getViewList();
            const pos = view.findIndex(v => v.index === currentSongIndex);
            const song = songs[currentSongIndex];
            if (pos >= 0 && Math.floor(pos / PAGE_SIZE) + 1 === currentPage) {
                tip.classList.remove('show');
                tip.textContent = '';
                return;
            }
            tip.textContent = pos >= 0
                ? `▶ 正在播放《${song.meme}》· 在第 ${Math.floor(pos / PAGE_SIZE) + 1} 页（点击跳转）`
                : `▶ 正在播放《${song.meme}》· 已被搜索条件过滤（点击清除搜索）`;
            tip.classList.add('show');
            tip.onclick = () => {
                if (pos >= 0) {
                    currentPage = Math.floor(pos / PAGE_SIZE) + 1;
                } else {
                    searchQuery = '';
                    const si = document.getElementById('searchInput');
                    if (si) si.value = '';
                    currentPage = 1;
                }
                renderPlaylist();
                updatePlaylistHighlight();
            };
        }

        // ===== 键盘快捷键 =====
        document.addEventListener('keydown', (e) => {
            // 搜索框 / 文本域里不劫持方向键和回车（否则没法正常编辑）
            const inInput = e.target && (e.target.tagName === 'INPUT' ||
                                         e.target.tagName === 'TEXTAREA');

            if (e.code === 'Space' && !inInput) { e.preventDefault(); togglePlay(); }
            if (e.code === 'ArrowLeft' && !inInput) {
                audio.currentTime = Math.max(0, audio.currentTime - 5);
            }
            if (e.code === 'ArrowRight' && !inInput) {
                audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
            }

            // ↑↓ 在歌单里上下选歌，Enter 播放
            if (!inInput && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) {
                e.preventDefault();
                moveKeyboardSelection(e.code === 'ArrowUp' ? -1 : 1);
                return;
            }
            if (!inInput && e.code === 'Enter' && kbIndex >= 0) {
                const items = document.querySelectorAll('.playlist-item');
                if (items[kbIndex]) { e.preventDefault(); items[kbIndex].click(); }
                return;
            }

            // M 静音 / S 随机 / R 循环
            if (!inInput && (e.key === 'm' || e.key === 'M')) { toggleMute(); return; }
            if (!inInput && (e.key === 's' || e.key === 'S')) { toggleShuffle(); return; }
            if (!inInput && (e.key === 'r' || e.key === 'R')) { cycleRepeat(); return; }

            // [ 键 = 歌词提前0.5秒 / ] 键 = 歌词延后0.5秒
            // Shift + [ / ] = 微调 0.1 秒（系统性偏移通常只有零点几秒，0.5 步长太粗）
            // ⚠️ 必须用 else if：两个独立 if 会先走 0.5 再叠加 0.1，变成 0.6
            if (e.shiftKey && e.code === 'BracketLeft') { adjustOffset(-0.1); }
            else if (e.shiftKey && e.code === 'BracketRight') { adjustOffset(0.1); }
            else if (e.code === 'BracketLeft') { adjustOffset(-0.5); }
            else if (e.code === 'BracketRight') { adjustOffset(0.5); }
        });

        // ===== 启动 =====
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
