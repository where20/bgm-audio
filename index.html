<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 热梗音乐播放列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }
        
        /* 左侧播放器 */
        .player-section {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        
        /* 右侧播放列表 */
        .playlist-section {
            width: 350px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }
        
        .playlist-section::-webkit-scrollbar {
            width: 6px;
        }
        
        .playlist-section::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        
        .playlist-section::-webkit-scrollbar-thumb {
            background: #feca57;
            border-radius: 3px;
        }
        
        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header .subtitle {
            color: #a0a0a0;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        /* 专辑封面 */
        .album-cover {
            width: 220px;
            height: 220px;
            margin: 20px auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            transition: transform 0.3s;
        }
        
        .album-cover:hover {
            transform: scale(1.02);
        }
        
        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* 当前歌曲信息 */
        .now-playing {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .now-playing .song-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #feca57;
            margin-bottom: 5px;
        }
        
        .now-playing .song-meta {
            font-size: 0.9rem;
            color: #a0a0a0;
        }
        
        /* 音频播放器 */
        .audio-player {
            margin: 20px 0;
        }
        
        .progress-container {
            margin-bottom: 15px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #a0a0a0;
            margin-top: 8px;
        }
        
        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            padding: 10px;
        }
        
        .control-btn:hover {
            transform: scale(1.2);
            color: #feca57;
        }
        
        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 5px 20px rgba(255,107,107,0.4);
        }
        
        .play-btn:hover {
            transform: scale(1.1);
            color: #fff;
        }
        
        /* 速度控制 */
        .speed-control {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        
        .speed-btn {
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            color: #fff;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        
        .speed-btn:hover, .speed-btn.active {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            border-color: transparent;
        }
        
        /* 歌词区域 */
        .lyrics-container {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            height: 250px;
            overflow-y: auto;
            scroll-behavior: smooth;
            margin-top: 20px;
        }
        
        .lyrics-container::-webkit-scrollbar {
            width: 4px;
        }
        
        .lyrics-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
        
        .lyrics-container::-webkit-scrollbar-thumb {
            background: #feca57;
            border-radius: 2px;
        }
        
        .lyric-line {
            padding: 8px 15px;
            font-size: 1rem;
            color: rgba(255,255,255,0.4);
            text-align: center;
            transition: all 0.3s;
            cursor: default;
        }
        
        .lyric-line.active {
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(90deg, transparent, rgba(254,202,87,0.2), transparent);
            text-shadow: 0 0 20px rgba(254,202,87,0.5);
        }
        
        .lyric-line.before {
            color: rgba(255,255,255,0.25);
        }
        
        /* 播放列表 */
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .playlist-header h2 {
            font-size: 1.1rem;
            color: #feca57;
        }
        
        .playlist-header .count {
            font-size: 0.85rem;
            color: #666;
        }
        
        .playlist-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 5px;
        }
        
        .playlist-item:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .playlist-item.active {
            background: linear-gradient(90deg, rgba(255,107,107,0.2), rgba(254,202,87,0.1));
            border-left: 3px solid #feca57;
        }
        
        .playlist-item .index {
            width: 30px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }
        
        .playlist-item.active .index {
            color: #feca57;
        }
        
        .playlist-item .info {
            flex: 1;
        }
        
        .playlist-item .title {
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 3px;
        }
        
        .playlist-item .meta {
            font-size: 0.8rem;
            color: #666;
        }
        
        .playlist-item .play-icon {
            font-size: 1.2rem;
            color: #feca57;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .playlist-item:hover .play-icon,
        .playlist-item.active .play-icon {
            opacity: 1;
        }
        
        /* 底部信息 */
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.8rem;
        }
        
        .footer a {
            color: #feca57;
            text-decoration: none;
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 50px;
            color: #a0a0a0;
        }
        
        /* 响应式 */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            
            .playlist-section {
                width: 100%;
                max-height: 400px;
            }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 1.4rem;
            }
            
            .album-cover {
                width: 180px;
                height: 180px;
            }
            
            .lyrics-container {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧播放器 -->
        <div class="player-section">
            <div class="header">
                <h1>🎵 热梗音乐播放列表</h1>
                <div class="subtitle">每天更新 · 歌词同步滚动</div>
            </div>
            
            <div class="now-playing">
                <div class="song-title" id="songTitle">加载中...</div>
                <div class="song-meta" id="songMeta"></div>
            </div>
            
            <div class="album-cover" id="albumCover">🎵</div>
            
            <div class="audio-player">
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="control-btn" onclick="prevSong()" title="上一首">⏮</button>
                    <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
                    <button class="control-btn" onclick="nextSong()" title="下一首">⏭</button>
                </div>
                
                <div class="speed-control">
                    <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
                    <button class="speed-btn" onclick="setSpeed(0.75)">0.75x</button>
                    <button class="speed-btn active" onclick="setSpeed(1)">1x</button>
                    <button class="speed-btn" onclick="setSpeed(1.25)">1.25x</button>
                    <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
                    <button class="speed-btn" onclick="setSpeed(2)">2x</button>
                </div>
            </div>
            
            <!-- 歌词区域（默认隐藏，可通过按钮显示）
            <div class="lyrics-container" id="lyricsContainer">
                <div class="lyric-line">🎤 歌词加载中...</div>
            </div>
            -->
        </div>
        
        <!-- 右侧播放列表 -->
        <div class="playlist-section">
            <div class="playlist-header">
                <h2>📜 播放列表</h2>
                <span class="count" id="playlistCount">0 首</span>
            </div>
            <div id="playlistItems"></div>
        </div>
    </div>
    
    <div class="footer">
        <p>由 <a href="https://github.com/where20/bgm-audio" target="_blank">bgm-audio</a> 自动生成 · <a href="https://where20.github.io/bgm-audio/" target="_blank">在线播放</a></p>
    </div>
    
    <audio id="audioPlayer"></audio>
    
    <script>
        // 全局变量
        let playlist = [];
        let currentIndex = 0;
        let lyrics = [];
        let currentLyricIndex = -1;
        let isPlaying = false;
        
        // 初始化
        async function init() {
            try {
                const response = await fetch('music.json');
                const data = await response.json();
                
                playlist = data.playlist || [];
                document.getElementById('playlistCount').textContent = playlist.length + ' 首';
                
                // 渲染播放列表
                renderPlaylist();
                
                // 加载第一首
                if (playlist.length > 0) {
                    loadSong(0);
                }
                
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('songTitle').textContent = '加载失败，请刷新重试';
            }
        }
        
        // 渲染播放列表
        function renderPlaylist() {
            const container = document.getElementById('playlistItems');
            container.innerHTML = '';
            
            playlist.forEach((song, index) => {
                const div = document.createElement('div');
                div.className = 'playlist-item' + (index === currentIndex ? ' active' : '');
                div.innerHTML = `
                    <span class="index">${index + 1}</span>
                    <div class="info">
                        <div class="title">🔥 ${song.meme}</div>
                        <div class="meta">${song.date} · ${song.style}</div>
                    </div>
                    <span class="play-icon">▶</span>
                `;
                div.onclick = () => loadSong(index);
                container.appendChild(div);
            });
        }
        
        // 加载歌曲
        function loadSong(index) {
            if (index < 0 || index >= playlist.length) return;
            
            currentIndex = index;
            const song = playlist[index];
            
            // 更新标题
            document.getElementById('songTitle').textContent = '🔥 ' + song.meme;
            document.getElementById('songMeta').textContent = song.date + ' · ' + song.style;
            
            // 更新封面
            const coverEl = document.getElementById('albumCover');
            if (song.image) {
                coverEl.innerHTML = `<img src="${song.image}" alt="封面" onerror="this.parentElement.textContent='${song.meme.charAt(0)}'">`;
            } else {
                coverEl.textContent = song.meme.charAt(0);
            }
            
            // 设置音频
            const audio = document.getElementById('audioPlayer');
            audio.src = song.audio;
            
            // 等待音频加载后获取时长，再解析歌词
            audio.addEventListener('loadedmetadata', function onLoad() {
                audio.removeEventListener('loadedmetadata', onLoad);
                parseLyrics(song.lyrics, audio.duration);
            });
            
            // 更新播放列表样式
            renderPlaylist();
            
            // 自动播放
            audio.play().then(() => {
                isPlaying = true;
                updatePlayButton();
            }).catch(e => {
                console.log('自动播放被阻止');
            });
        }
        
        // 解析歌词（支持自动平均分配）
        function parseLyrics(text, duration) {
            lyrics = [];
            if (!text) {
                lyrics = [{ time: 0, text: '暂无歌词' }];
                renderLyrics();
                return;
            }
            
            const lines = text.split('\n');
            const pureLines = [];
            
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                
                // 检查是否有时间戳
                const match = line.match(/\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/);
                
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseInt(match[2]);
                    const ms = match[3] ? parseInt(match[3].padEnd(3, '0')) : 0;
                    const time = minutes * 60 + seconds + ms / 1000;
                    const lyricText = match[4].trim();
                    
                    if (lyricText) {
                        lyrics.push({ time, text: lyricText });
                    }
                } else if (line) {
                    pureLines.push(line);
                }
            });
            
            // 如果没有时间戳，自动平均分配
            if (lyrics.length === 0 && pureLines.length > 0) {
                const avgDuration = (duration || 60) / pureLines.length;
                pureLines.forEach((line, index) => {
                    lyrics.push({
                        time: index * avgDuration,
                        text: line
                    });
                });
            }
            
            lyrics.sort((a, b) => a.time - b.time);
            renderLyrics();
        }
        
        // 渲染歌词
        function renderLyrics() {
            const container = document.getElementById('lyricsContainer');
            container.innerHTML = '';
            
            lyrics.forEach((lyric, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.textContent = lyric.text;
                div.dataset.index = index;
                container.appendChild(div);
            });
        }
        
        // 更新歌词高亮
        function updateLyrics() {
            const audio = document.getElementById('audioPlayer');
            const currentTime = audio.currentTime;
            const container = document.getElementById('lyricsContainer');
            const lyricLines = container.querySelectorAll('.lyric-line');
            
            let newIndex = -1;
            for (let i = lyrics.length - 1; i >= 0; i--) {
                if (currentTime >= lyrics[i].time) {
                    newIndex = i;
                    break;
                }
            }
            
            if (newIndex !== currentLyricIndex) {
                currentLyricIndex = newIndex;
                
                lyricLines.forEach((line, index) => {
                    line.classList.remove('active', 'before');
                    if (index === newIndex) {
                        line.classList.add('active');
                    } else if (index < newIndex) {
                        line.classList.add('before');
                    }
                });
                
                if (newIndex >= 0) {
                    const activeLine = lyricLines[newIndex];
                    if (activeLine) {
                        const containerHeight = container.clientHeight;
                        const lineTop = activeLine.offsetTop;
                        const scrollTo = lineTop - containerHeight / 3;
                        
                        container.scrollTo({
                            top: scrollTo,
                            behavior: 'smooth'
                        });
                    }
                }
            }
        }
        
        // 播放控制
        function togglePlay() {
            const audio = document.getElementById('audioPlayer');
            
            if (audio.paused) {
                audio.play();
                isPlaying = true;
            } else {
                audio.pause();
                isPlaying = false;
            }
            
            updatePlayButton();
        }
        
        function updatePlayButton() {
            document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
        }
        
        // 上一首/下一首
        function prevSong() {
            loadSong((currentIndex - 1 + playlist.length) % playlist.length);
        }
        
        function nextSong() {
            loadSong((currentIndex + 1) % playlist.length);
        }
        
        // 进度更新
        function updateProgress() {
            const audio = document.getElementById('audioPlayer');
            if (isNaN(audio.duration)) return;
            
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
            document.getElementById('duration').textContent = formatTime(audio.duration);
        }
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // 进度条点击
        document.getElementById('progressBar').addEventListener('click', function(e) {
            const audio = document.getElementById('audioPlayer');
            const rect = this.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });
        
        // 速度控制
        function setSpeed(speed) {
            const audio = document.getElementById('audioPlayer');
            audio.playbackRate = speed;
            
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        // 事件监听
        document.getElementById('audioPlayer').addEventListener('timeupdate', function() {
            updateProgress();
            updateLyrics();
        });
        
        document.getElementById('audioPlayer').addEventListener('ended', function() {
            nextSong();
        });
        
        document.getElementById('audioPlayer').addEventListener('play', function() {
            isPlaying = true;
            updatePlayButton();
        });
        
        document.getElementById('audioPlayer').addEventListener('pause', function() {
            isPlaying = false;
            updatePlayButton();
        });
        
        // 键盘控制
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.code === 'ArrowLeft') {
                const audio = document.getElementById('audioPlayer');
                audio.currentTime = Math.max(0, audio.currentTime - 5);
            } else if (e.code === 'ArrowRight') {
                const audio = document.getElementById('audioPlayer');
                audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
            } else if (e.code === 'ArrowUp') {
                prevSong();
            } else if (e.code === 'ArrowDown') {
                nextSong();
            }
        });
        
        // 启动
        init();
    </script>
</body>
</html>
