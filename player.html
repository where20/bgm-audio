<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热梗歌词音乐播放器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0D1117 0%, #161B22 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            background: #161B22;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* 左侧：播放器 */
        .player-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: sticky;
            top: 20px;
        }

        .album-art {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 15px;
            overflow: hidden;
            background: #21262D;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 默认封面（无图时显示） */
        .album-art .default-cover {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
            letter-spacing: 4px;
            padding: 20px;
            text-align: center;
            word-break: break-all;
        }

        .album-art .playing-indicator {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(13, 17, 23, 0.85);
            border-radius: 20px;
            padding: 6px 12px;
            display: none;
            align-items: center;
            gap: 4px;
        }

        .album-art .playing-indicator.show {
            display: flex;
        }

        .bar {
            width: 3px;
            background: #58a6ff;
            border-radius: 2px;
            animation: barAnim 0.8s ease-in-out infinite alternate;
        }
        .bar:nth-child(1) { height: 12px; animation-delay: 0s; }
        .bar:nth-child(2) { height: 18px; animation-delay: 0.15s; }
        .bar:nth-child(3) { height: 10px; animation-delay: 0.3s; }
        .bar:nth-child(4) { height: 16px; animation-delay: 0.45s; }

        @keyframes barAnim {
            0% { transform: scaleY(0.4); }
            100% { transform: scaleY(1); }
        }

        .song-info { text-align: center; }

        .song-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-meta {
            font-size: 13px;
            color: #8B949E;
        }

        .progress-container { margin: 8px 0; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #21262D;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #58a6ff, #1f6feb);
            border-radius: 3px;
            width: 0%;
            transition: width 0.15s linear;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8B949E;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #c9d1d9;
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
            line-height: 1;
        }

        .control-btn:hover {
            background: #21262D;
            color: #ffffff;
        }

        .play-btn {
            background: #238636;
            color: #ffffff;
            width: 56px;
            height: 56px;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn:hover {
            background: #2ea043;
        }

        /* 歌词偏移调整 */
        .lyrics-offset-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: #0D1117;
            border-radius: 8px;
            font-size: 12px;
            color: #8B949E;
        }

        .lyrics-offset-bar .offset-label {
            white-space: nowrap;
            min-width: 36px;
            text-align: right;
            color: #58a6ff;
            font-weight: 600;
            font-size: 13px;
        }

        .offset-btn {
            background: #21262D;
            border: 1px solid #30363D;
            color: #c9d1d9;
            cursor: pointer;
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.15s;
        }

        .offset-btn:hover {
            background: #30363D;
            color: #ffffff;
        }

        .offset-btn:active {
            transform: scale(0.95);
        }

        .lyrics-offset-bar .offset-hint {
            color: #484F58;
            font-size: 11px;
            margin-left: auto;
        }

        /* 播放列表（左侧下方） */
        .playlist-wrap {
            max-height: 260px;
            overflow-y: auto;
            border-top: 1px solid #21262D;
            padding-top: 12px;
        }

        .playlist-wrap::-webkit-scrollbar { width: 6px; }
        .playlist-wrap::-webkit-scrollbar-track { background: transparent; }
        .playlist-wrap::-webkit-scrollbar-thumb { background: #30363D; border-radius: 3px; }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .playlist-item:hover {
            background: #21262D;
        }

        .playlist-item.active {
            background: rgba(35, 134, 54, 0.15);
            border-left-color: #238636;
        }

        .playlist-item .pi-idx {
            font-size: 12px;
            color: #484F58;
            width: 20px;
            text-align: right;
            flex-shrink: 0;
        }

        .playlist-item.active .pi-idx {
            color: #238636;
        }

        .playlist-item .pi-info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item .pi-name {
            font-size: 13px;
            font-weight: 500;
            color: #c9d1d9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item.active .pi-name {
            color: #ffffff;
        }

        .playlist-item .pi-style {
            font-size: 11px;
            color: #484F58;
        }

        /* 右侧：歌词区域 */
        .lyrics-section {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .lyrics-header {
            font-size: 15px;
            font-weight: 600;
            color: #58a6ff;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .lyrics-container {
            flex: 1;
            min-height: 500px;
            max-height: 70vh;
            overflow-y: auto;
            padding: 40px 16px;
            background: #0D1117;
            border-radius: 12px;
            scroll-behavior: smooth;
            position: relative;
        }

        .lyrics-container::-webkit-scrollbar { width: 6px; }
        .lyrics-container::-webkit-scrollbar-track { background: transparent; }
        .lyrics-container::-webkit-scrollbar-thumb { background: #30363D; border-radius: 3px; }

        .lyric-line {
            padding: 10px 16px;
            margin: 4px 0;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.7;
            color: #484F58;
            transition: all 0.35s ease;
            text-align: center;
            cursor: pointer;
        }

        .lyric-line:hover {
            color: #8B949E;
        }

        .lyric-line.active {
            color: #ffffff;
            background: rgba(88, 166, 255, 0.12);
            font-weight: 600;
            font-size: 18px;
            transform: scale(1.03);
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.3);
        }

        .lyric-line.near {
            color: #8B949E;
        }

        .lyric-line.passed {
            color: #30363D;
        }

        .lyric-line.section-label {
            font-size: 12px;
            color: #238636;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 16px 16px 4px;
        }

        .lyrics-placeholder {
            color: #484F58;
            text-align: center;
            padding: 80px 20px;
            font-size: 15px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 16px;
            }

            .player-section {
                position: static;
            }

            .lyrics-container {
                min-height: 300px;
                max-height: 50vh;
            }

            .album-art {
                max-width: 280px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧：播放器 + 播放列表 -->
        <div class="player-section">
            <div class="album-art" id="albumArt">
                <div class="default-cover" style="background: linear-gradient(135deg, #238636, #1f6feb);">🎵</div>
                <div class="playing-indicator" id="playingIndicator">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <div class="song-info">
                <div class="song-title" id="songTitle">选择歌曲开始播放</div>
                <div class="song-meta" id="songMeta">热梗歌词音乐</div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="prevBtn" title="上一首">⏮</button>
                <button class="control-btn play-btn" id="playBtn" title="播放">▶</button>
                <button class="control-btn" id="nextBtn" title="下一首">⏭</button>
            </div>

            <!-- 歌词偏移调整条 -->
            <div class="lyrics-offset-bar" id="offsetBar">
                <span>⏱ 歌词偏移</span>
                <button class="offset-btn" id="offsetMinus" title="歌词提前0.5秒">-0.5s</button>
                <button class="offset-btn" id="offsetReset" title="重置偏移">↺</button>
                <button class="offset-btn" id="offsetPlus" title="歌词延后0.5秒">+0.5s</button>
                <span class="offset-label" id="offsetValue">0.0s</span>
                <span class="offset-hint">快捷键 [ ]</span>
            </div>

            <!-- 播放列表 -->
            <div class="playlist-wrap" id="playlist">
                <div class="lyrics-placeholder">加载中...</div>
            </div>
        </div>

        <!-- 右侧：歌词 -->
        <div class="lyrics-section">
            <div class="lyrics-header">🎤 歌词同步滚动</div>
            <div class="lyrics-container" id="lyricsContainer">
                <div class="lyrics-placeholder">点击左侧歌曲开始播放<br>歌词将自动滚动高亮</div>
            </div>
        </div>
    </div>

    <script>
        // ===== 全局状态 =====
        let audio = new Audio();
        let currentSongIndex = -1;
        let songs = [];
        let lyricsData = [];     // [{ time, text, isLabel }]
        let isPlaying = false;
        let lastActiveIndex = -1;
        let lyricsOffset = 0;    // 歌词偏移量（秒），正数=延后，负数=提前
        const OFFSET_KEY = 'bgm_lyrics_offset_';

        // 封面图渐变色方案（按歌曲索引轮换）
        const coverGradients = [
            ['#e85d3a', '#c23065'],  // 橙红
            ['#1f6feb', '#58a6ff'],  // 蓝
            ['#238636', '#2ea043'],  // 绿
            ['#8b5cf6', '#d946ef'],  // 紫粉
            ['#f59e0b', '#ef4444'],  // 金红
            ['#06b6d4', '#3b82f6'],  // 青蓝
            ['#ec4899', '#f43f5e'],  // 粉红
            ['#10b981', '#059669'],  // 翡翠
            ['#6366f1', '#a855f7'],  // 靛紫
        ];

        // ===== 初始化 =====
        async function init() {
            await loadPlaylist();
            renderPlaylist();

            document.getElementById('playBtn').addEventListener('click', togglePlay);
            document.getElementById('prevBtn').addEventListener('click', playPrev);
            document.getElementById('nextBtn').addEventListener('click', playNext);
            document.getElementById('progressBar').addEventListener('click', seek);

            // 偏移控制
            document.getElementById('offsetMinus').addEventListener('click', () => adjustOffset(-0.5));
            document.getElementById('offsetPlus').addEventListener('click', () => adjustOffset(0.5));
            document.getElementById('offsetReset').addEventListener('click', () => { lyricsOffset = 0; saveOffset(); updateOffsetDisplay(); });

            audio.addEventListener('timeupdate', onTimeUpdate);
            audio.addEventListener('loadedmetadata', updateDuration);
            audio.addEventListener('ended', playNext);
            audio.addEventListener('play', () => {
                isPlaying = true;
                document.getElementById('playBtn').textContent = '⏸';
                document.getElementById('playingIndicator').classList.add('show');
            });
            audio.addEventListener('pause', () => {
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶';
                document.getElementById('playingIndicator').classList.remove('show');
            });
        }

        // ===== 加载播放列表 =====
        async function loadPlaylist() {
            try {
                const response = await fetch('music.json');
                const data = await response.json();
                songs = data.playlist || [];
            } catch (error) {
                console.error('加载播放列表失败:', error);
            }
        }

        // ===== 渲染播放列表 =====
        function renderPlaylist() {
            const el = document.getElementById('playlist');
            el.innerHTML = '';
            songs.forEach((song, i) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.onclick = () => playSong(i);
                item.innerHTML = `
                    <span class="pi-idx">${i + 1}</span>
                    <div class="pi-info">
                        <div class="pi-name">${song.meme}</div>
                        <div class="pi-style">${song.style || ''} · ${song.date}</div>
                    </div>
                `;
                el.appendChild(item);
            });
        }

        // ===== 解析音频URL（支持相对路径自动转CDN） =====
        function resolveAudioUrl(path) {
            if (!path) return '';
            if (path.startsWith('http')) return path;
            // 相对路径转为CDN URL（使用最新commit）
            return 'https://cdn.jsdelivr.net/gh/where20/bgm-audio@bd32fe5/' + path;
        }

        // ===== 解析封面URL =====
        function resolveImageUrl(path) {
            if (!path) return '';
            if (path.startsWith('http')) return path;
            // 相对路径转为CDN URL
            return 'https://cdn.jsdelivr.net/gh/where20/bgm-audio@bd32fe5/' + path;
        }

        // ===== 设置封面图（带容错） =====
        function setAlbumArt(song, index) {
            const albumArt = document.getElementById('albumArt');
            const indicator = document.getElementById('playingIndicator');
            const imgSrc = resolveImageUrl(song.image);

            if (imgSrc) {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = song.meme;
                img.onerror = function() {
                    // 封面加载失败，显示默认渐变封面
                    showDefaultCover(albumArt, song.meme, index);
                };
                img.onload = function() {
                    albumArt.innerHTML = '';
                    albumArt.appendChild(img);
                    albumArt.appendChild(indicator);
                };
                // 先显示默认封面，图片加载完后替换
                showDefaultCover(albumArt, song.meme, index);
                // 触发加载
                img.src = imgSrc;
            } else {
                showDefaultCover(albumArt, song.meme, index);
            }
        }

        function showDefaultCover(container, text, index) {
            const indicator = document.getElementById('playingIndicator');
            const grad = coverGradients[index % coverGradients.length];
            container.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'default-cover';
            div.style.background = `linear-gradient(135deg, ${grad[0]}, ${grad[1]})`;
            div.textContent = text || '🎵';
            container.appendChild(div);
            container.appendChild(indicator);
        }

        // ===== 播放歌曲 =====
        async function playSong(index) {
            if (index < 0 || index >= songs.length) return;

            currentSongIndex = index;
            const song = songs[index];

            audio.src = resolveAudioUrl(song.audio);
            audio.load();

            document.getElementById('songTitle').textContent = song.meme;
            document.getElementById('songMeta').textContent = `${song.style || ''} · ${song.date}`;

            // 设置封面图
            setAlbumArt(song, index);

            // 加载偏移量
            lyricsOffset = loadOffset(song.id || song.meme);
            updateOffsetDisplay();

            parseLyrics(song.lyrics);
            updatePlaylistHighlight();
            lastActiveIndex = -1;

            try {
                await audio.play();
            } catch (e) {
                console.warn('自动播放被阻止，请手动点击播放');
            }
        }

        // ===== 歌词偏移量管理 =====
        function loadOffset(songId) {
            try {
                const val = localStorage.getItem(OFFSET_KEY + songId);
                return val ? parseFloat(val) : 0;
            } catch(e) { return 0; }
        }

        function saveOffset() {
            if (currentSongIndex < 0) return;
            const song = songs[currentSongIndex];
            try {
                localStorage.setItem(OFFSET_KEY + (song.id || song.meme), lyricsOffset.toString());
            } catch(e) {}
        }

        function adjustOffset(delta) {
            lyricsOffset = Math.round((lyricsOffset + delta) * 10) / 10;
            // 限制范围 ±5秒
            lyricsOffset = Math.max(-5, Math.min(5, lyricsOffset));
            saveOffset();
            updateOffsetDisplay();
        }

        function updateOffsetDisplay() {
            const el = document.getElementById('offsetValue');
            const val = lyricsOffset;
            el.textContent = (val >= 0 ? '+' : '') + val.toFixed(1) + 's';
            el.style.color = val === 0 ? '#58a6ff' : (val > 0 ? '#f0883e' : '#a5d6ff');
        }

        // ===== 歌词解析（核心 - 修复版） =====
        function parseLyrics(lyricsText) {
            lyricsData = [];

            if (!lyricsText || lyricsText === '歌词时间戳') {
                lyricsData = [{ time: 0, text: '暂无歌词', isLabel: false }];
                renderLyrics();
                return;
            }

            // 清理markdown标记
            let cleaned = lyricsText
                .replace(/```[\s\S]*?```/g, '')  // 移除代码块
                .replace(/\*\*\[([^\]]+)\]\*\*/g, '[$1]')  // **[Label]** → [Label]
                .replace(/\*\*/g, '');

            const lines = cleaned.split('\n');

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                // 匹配 [MM:SS.mm] 或 [MM:SS] 格式
                const tsRegex = /^\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/;
                const match = line.match(tsRegex);

                if (match) {
                    const minutes = parseInt(match[1], 10);
                    const seconds = parseInt(match[2], 10);
                    // 修复毫秒解析：确保3位精度
                    let ms = 0;
                    if (match[3]) {
                        const raw = match[3];
                        if (raw.length === 1) ms = parseInt(raw, 10) * 100;        // .5 → 500ms
                        else if (raw.length === 2) ms = parseInt(raw, 10) * 10;   // .50 → 500ms
                        else ms = parseInt(raw, 10);                                 // .500 → 500ms
                    }
                    const time = minutes * 60 + seconds + ms / 1000;
                    let text = match[4].trim();

                    // 清理嵌套标签 如 [Verse 1][慢节奏]歌词
                    const nestedTag = text.match(/^\[([^\]]+)\](.*)/);
                    if (nestedTag) {
                        const label = nestedTag[1].trim();
                        const rest = nestedTag[2].trim();
                        if (!rest) {
                            lyricsData.push({ time, text: `♫ ${label}`, isLabel: true });
                            return;
                        }
                        text = rest;
                    }

                    // 清理剩余括号标签
                    text = text.replace(/\[([^\]]+)\]/g, '').trim();

                    if (text && !text.startsWith('（') || text.length > 4) {
                        lyricsData.push({ time, text, isLabel: false });
                    } else if (text) {
                        lyricsData.push({ time, text, isLabel: true });
                    }
                }
                else if (/^\[[^\d\]]+\]$/.test(line)) {
                    const label = line.slice(1, -1).trim();
                    lyricsData.push({ time: null, text: `♫ ${label}`, isLabel: true });
                }
            });

            // 排序
            lyricsData.sort((a, b) => {
                if (a.time === null && b.time === null) return 0;
                if (a.time === null) return 1;
                if (b.time === null) return -1;
                return a.time - b.time;
            });

            // 去重
            const seen = new Set();
            lyricsData = lyricsData.filter(l => {
                if (l.time === null) return true;
                const key = l.time.toFixed(2);
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            renderLyrics();
        }

        // ===== 渲染歌词 =====
        function renderLyrics() {
            const container = document.getElementById('lyricsContainer');
            container.innerHTML = '';

            if (lyricsData.length === 0) {
                container.innerHTML = '<div class="lyrics-placeholder">暂无歌词</div>';
                return;
            }

            lyricsData.forEach((lyric, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line' + (lyric.isLabel ? ' section-label' : '');
                div.textContent = lyric.text;
                div.dataset.index = index;
                if (lyric.time !== null) {
                    div.addEventListener('click', () => {
                        audio.currentTime = lyric.time;
                    });
                }
                container.appendChild(div);
            });
        }

        // ===== 歌词高亮更新（核心 - 加入偏移量） =====
        function updateLyricsHighlight() {
            if (lyricsData.length === 0) return;

            // 应用偏移量：如果歌词偏早（需要延后），则用更小的currentTime来匹配
            // lyricsOffset > 0 表示歌词需要延后显示 = 用更早的时间匹配
            const effectiveTime = audio.currentTime - lyricsOffset;
            let activeIndex = -1;

            for (let i = lyricsData.length - 1; i >= 0; i--) {
                if (lyricsData[i].time !== null && lyricsData[i].time <= effectiveTime) {
                    activeIndex = i;
                    break;
                }
            }

            if (activeIndex === lastActiveIndex) return;
            lastActiveIndex = activeIndex;

            const lines = document.querySelectorAll('.lyric-line');
            lines.forEach((line, index) => {
                line.classList.remove('active', 'near', 'passed');

                if (index === activeIndex) {
                    line.classList.add('active');
                    line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else if (index >= activeIndex - 2 && index <= activeIndex + 2) {
                    line.classList.add('near');
                } else if (index < activeIndex) {
                    line.classList.add('passed');
                }
            });
        }

        // ===== 播放控制 =====
        function togglePlay() {
            if (currentSongIndex === -1) {
                playSong(0);
                return;
            }
            if (isPlaying) { audio.pause(); } else { audio.play(); }
        }

        function playPrev() {
            if (currentSongIndex > 0) playSong(currentSongIndex - 1);
        }

        function playNext() {
            if (currentSongIndex < songs.length - 1) {
                playSong(currentSongIndex + 1);
            } else {
                audio.pause();
            }
        }

        // ===== 进度更新 =====
        function onTimeUpdate() {
            if (!audio.duration) return;
            const pct = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress').style.width = pct + '%';
            document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
            updateLyricsHighlight();
        }

        function updateDuration() {
            document.getElementById('duration').textContent = formatTime(audio.duration);
        }

        function seek(e) {
            if (!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = Math.max(0, Math.min(pct * audio.duration, audio.duration));
        }

        function formatTime(s) {
            if (isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + String(sec).padStart(2, '0');
        }

        // ===== 播放列表高亮 =====
        function updatePlaylistHighlight() {
            document.querySelectorAll('.playlist-item').forEach((item, i) => {
                item.classList.toggle('active', i === currentSongIndex);
            });
            const activeItem = document.querySelector('.playlist-item.active');
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // ===== 键盘快捷键 =====
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
            if (e.code === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 5); }
            if (e.code === 'ArrowRight') { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); }
            // [ 键 = 歌词提前0.5秒
            if (e.code === 'BracketLeft') { adjustOffset(-0.5); }
            // ] 键 = 歌词延后0.5秒
            if (e.code === 'BracketRight') { adjustOffset(0.5); }
        });

        // ===== 启动 =====
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
