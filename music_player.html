<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热梗说唱播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .player-container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 24px;
        }
        .audio-wrapper {
            background: #f5f5f5;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }
        audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
        }
        .speed-control {
            margin-top: 16px;
        }
        .speed-label {
            color: #555;
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .speed-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .speed-btn {
            flex: 1;
            min-width: 50px;
            padding: 10px 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .speed-btn:hover {
            background: #667eea;
            color: white;
        }
        .speed-btn.active {
            background: #667eea;
            color: white;
        }
        .tip {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
        }
        .tip-title {
            color: #856404;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .tip-text {
            color: #856404;
            font-size: 0.85rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <h1>热梗说唱 - 养龙虾</h1>
        <p class="subtitle">节奏风格：慢热型 | 今日热梗</p>
        
        <div class="audio-wrapper">
            <audio id="audioPlayer" controls>
                <source src="https://cdn.jsdelivr.net/gh/where20/bgm-audio@main/vocal_养龙虾_20260505.mp3" type="audio/mpeg">
                您的浏览器不支持音频播放
            </audio>
            
            <div class="speed-control">
                <div class="speed-label">
                    <span>播放速度</span>
                    <span id="currentSpeed">1.0x</span>
                </div>
                <div class="speed-buttons">
                    <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
                    <button class="speed-btn" onclick="setSpeed(0.75)">0.75x</button>
                    <button class="speed-btn active" onclick="setSpeed(1.0)">1.0x</button>
                    <button class="speed-btn" onclick="setSpeed(1.25)">1.25x</button>
                    <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
                    <button class="speed-btn" onclick="setSpeed(2.0)">2.0x</button>
                </div>
            </div>
        </div>
        
        <div class="tip">
            <div class="tip-title">💡 听歌小技巧</div>
            <div class="tip-text">
                点击上方按钮调整播放速度<br>
                慢节奏段落可用 <b>0.75x</b> 细细品味<br>
                快节奏Hook可用 <b>1.25x</b> 更带感<br>
                默认 <b>1.0x</b> 正常速度收听
            </div>
        </div>
    </div>
    
    <script>
        const audio = document.getElementById('audioPlayer');
        const currentSpeedEl = document.getElementById('currentSpeed');
        const speedBtns = document.querySelectorAll('.speed-btn');
        
        function setSpeed(speed) {
            audio.playbackRate = speed;
            currentSpeedEl.textContent = speed.toFixed(2) + 'x';
            
            speedBtns.forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === speed + 'x' || 
                    (speed === 1 && btn.textContent === '1.0x') ||
                    (speed === 0.75 && btn.textContent === '0.75x') ||
                    (speed === 0.5 && btn.textContent === '0.5x') ||
                    (speed === 1.25 && btn.textContent === '1.25x') ||
                    (speed === 1.5 && btn.textContent === '1.5x') ||
                    (speed === 2 && btn.textContent === '2.0x')) {
                    btn.classList.add('active');
                }
            });
        }
        
        // 初始化
        audio.addEventListener('loadedmetadata', () => {
            console.log('音频已加载');
        });
    </script>
</body>
</html>
